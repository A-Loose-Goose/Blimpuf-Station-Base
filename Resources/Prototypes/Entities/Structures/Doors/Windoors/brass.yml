- type: entity
  id: BaseBrassWindoor
  name: brass windoor
  parent: BaseWindoor
  abstract: true
  components:
  - type: Sprite
    sprite: Structures/Doors/Windoors/brass_windoor.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
    - state: closed_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseUnlit"]
      visible: false
    - state: welded
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: bolted_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseBolted"]
    - state: emergency_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseEmergencyAccess"]
    - state: panel_open
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: electrified_ai
      sprite: Interface/Misc/ai_hud.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.HUD"]
    - state: electrified
      sprite: Effects/electricity.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.Sparks"]
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors: #excess damage (nuke?). avoid computational cost of spawning entities.
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassClockwork:
            min: 1
            max: 2
          SheetBrass1:
            min: 0
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: Windoor
    node: windoorBrass
    containers:
    - board
  - type: StaticPrice
    price: 240

- type: entity
  id: BaseSecureBrassWindoor
  parent: [BaseDeltaPressureReinforcedGlassQuarter, BaseWindoor]
  abstract: true
  components:
    - type: Sprite
      sprite: Structures/Doors/Windoors/brass_windoor.rsi
      layers:
        - state: secure_underlay
        - state: closed
          map: [ "enum.DoorVisualLayers.Base" ]
        - state: closed_unlit
          shader: unshaded
          map: [ "enum.DoorVisualLayers.BaseUnlit" ]
          visible: false
        - state: welded
          map: [ "enum.WeldableLayers.BaseWelded" ]
        - state: bolted_unlit
          shader: unshaded
          map: [ "enum.DoorVisualLayers.BaseBolted" ]
        - state: emergency_unlit
          shader: unshaded
          map: [ "enum.DoorVisualLayers.BaseEmergencyAccess" ]
        - state: panel_open
          map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
          visible: false
        - state: electrified_ai
          sprite: Interface/Misc/ai_hud.rsi
          shader: unshaded
          visible: false
          map: [ "enum.ElectrifiedLayers.HUD" ]
        - state: electrified
          sprite: Effects/electricity.rsi
          shader: unshaded
          visible: false
          map: [ "enum.ElectrifiedLayers.Sparks" ]
        - state: sparks
          map: ["enum.DoorVisualLayers.BaseEmagging"]
          shader: unshaded
          visible: false
    - type: Damageable
      damageModifierSet: RGlass
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 600
          behaviors: #excess damage (nuke?). avoid computational cost of spawning entities.
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 400
          behaviors:
            - !type:SpawnEntitiesBehavior
              spawn:
                ShardGlassClockwork:
                  min: 1
                  max: 2
                SheetBrassma1:
                  min: 1
                  max: 2
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
    - type: Construction
      graph: Windoor
      node: windoorBrassSecure
    - type: StaticPrice
      price: 350
    - type: Tag
      tags:
        - SecureWindoor
        # This tag is used to nagivate the Airlock construction graph. It's needed because the construction graph is shared between Airlock, AirlockGlass, and HighSecDoor
        - BulletUnarmedCollide #Starlight -- Make bullet pre-arming not phase through windoors
