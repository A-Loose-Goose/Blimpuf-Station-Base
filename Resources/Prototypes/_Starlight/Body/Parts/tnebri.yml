- type: entity
  id: PartTNebri
  parent: [BaseItem, BasePart]
  name: "T'Nebri body part"
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: CopperBlood
        Quantity: 10

- type: entity
  id: TorsoTNebri
  name: "T'Nebri torso"
  parent: [PartTNebri, BaseTorso]
  components:
