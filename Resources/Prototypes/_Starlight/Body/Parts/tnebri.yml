      sprite: _Starlight/Mobs/Species/Cyclorite/parts.rsi
      state: "torso"
    - type: Icon
      sprite: _Starlight/Mobs/Species/Cyclorite/parts.rsi
      state: "torso"
    - type: Extractable
      juiceSolution:
        reagents:
        - ReagentId: Fat
