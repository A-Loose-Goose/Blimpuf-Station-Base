- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase, ClothingHeadLightParamsIntermediate ] # Starlight
  id: ClothingHeadHelmetHardsuitUltima
  name: cybersun ultima hardsuit helmet
  description: An experimental hardsuit helmet for the Syndicate.
  components:
    - type: Sprite
      sprite: _Blimpuf/Clothing/Head/Hardsuits/syndicate-experimental-hardsuit.rsi
      layers:
        - state: icon
        - state: icon-unshaded
          shader: unshaded
        - state: light-overlay
          visible: false
          shader: unshaded
          map: [ "light" ]
    - type: HandheldLight
      addPrefix: false
    - type: ToggleableVisuals
      spriteLayer: light
      clothingVisuals:
        head:
          - state: equipped-head-light
            shader: unshaded
        head-vox:
          - state: equipped-head-light-vox
            shader: unshaded
        head-vulpkanin:
          - state: equipped-head-light-vulpkanin
            shader: unshaded
        head-reptilian:
          - state: equipped-head-light-reptilian
            shader: unshaded
        head-dog:
          - state: equipped-head-light-dog
            shader: unshaded
        # Starlight - Start
        head-avali:
          - state: equipped-head-light-avali
            shader: unshaded
        head-resomi:
          - state: equipped-head-light-resomi
            shader: unshaded
        # Starlight - End
    - type: Clothing
      clothingVisuals:
        head:
          - state: equipped-head
          - state: equipped-head-unshaded
            shader: unshaded
        head-vox:
          - state: equipped-head-vox
          - state: equipped-head-unshaded-vox
            shader: unshaded
        head-vulpkanin:
          - state: equipped-head-vulpkanin
          - state: equipped-head-unshaded-vulpkanin
            shader: unshaded
        head-reptilian:
          - state: equipped-head-reptilian
          - state: equipped-head-unshaded-reptilian
            shader: unshaded
        # Starlight - Start
        head-avali:
          - state: equipped-head-avali
          - state: equipped-head-unshaded-avali
            shader: unshaded
        head-resomi:
          - state: equipped-head-resomi
          - state: equipped-head-unshaded-resomi
            shader: unshaded
        # Starlight - End
    - type: PointLight
      color: "#50ff50" # Starlight
    - type: PressureProtection
      highPressureMultiplier: 0.1
      lowPressureMultiplier: 1000
    - type: Tag
      tags:
        - CorgiWearable
        - WhitelistChameleon
