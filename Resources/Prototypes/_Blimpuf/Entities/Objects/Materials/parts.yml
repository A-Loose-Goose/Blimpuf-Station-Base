- type: entity
  parent: [PartBase, BaseQuickConstructionMaterial] # DEN add quick construction parent
  id: PartRodBrass
  name: brass rod
  suffix: Full
  components:
    # Starlight start
    - type: UserInterface
      interfaces:
        enum.StackCustomSplitUiKey.Key:
          type: StackCustomSplitBoundUserInterface
        enum.QuickConstructionUiKey.Key:
          type: QuickConstructionBoundUserInterface
    # Starlight end
    - type: PhysicalComposition
      materialComposition:
        Brass: 50 # Half of a regular steel sheet to reflect the crafting recipe
    - type: Stack
      stackType: BrassRod
      baseLayer: base
      layerStates:
        - brassrods
        - brassrods_2
        - brassrods_3
        - brassrods_4
        - brassrods_5
    - type: Sprite
      sprite: _Blimpuf/Objects/Materials/parts/brass_rods.rsi
      state: brassrods_5
      layers:
        - state: brassrods_5
          map: ["base"]
    - type: Item
      sprite: _Blimpuf/Objects/Materials/parts/brass_rods.rsi
      size: Normal
      heldPrefix: brassrods
    - type: Construction
      graph: BrassRod
      node: BrassRod
    - type: Appearance
    - type: FloorTile
      outputs:
        - Lattice
        - FloorReinforced
    - type: StaticPrice
      price: 0
    - type: StackPrice
      price: 15
    - type: Extractable
      grindableSolutionName: brassrod
    - type: SolutionContainerManager
      solutions:
        brassrod:
          reagents:
            - ReagentId: Copper
              Quantity: 4.5
            - ReagentId: Zinc
              Quantity: 0.5
    - type: GuideHelp
      guides:
        - ExpandingRepairingStation
    - type: QuickConstructable # DEN quick construction
      category: BrassRod

- type: entity
  parent: PartRodBrass
  id: PartRodBrass10
  name: brass rod
  suffix: 10
  components:
    - type: Sprite
      state: brassrods
    - type: Stack
      count: 10

- type: entity
  parent: PartRodBrass
  id: PartRodBrass1
  name: brass rod
  suffix: Single
  components:
    - type: Sprite
      state: brassrods
    - type: Stack
      count: 1
