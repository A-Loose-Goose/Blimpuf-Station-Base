- type: entity
  parent: [BaseItem, BaseSyndicateContraband]
  id: PersonaHologramGeneratorNoBattery
  name: persona hologram generator
  description: An experimental strain of Holoparasite technology used to create a hard-light replica of most living beings around you. Disguise is destroyed when physical contact is made or deactivated. Doesn't allow the user to become Humanoids or Cyborgs.
  components:
    - type: Sprite
      sprite: /Textures/Objects/Devices/chameleon_projector.rsi
      layers:
        - state: icon
        - state: powered
          map: [ "enum.PowerDeviceVisualLayers.Powered" ]
        - state: decharging
          map: [ "enum.PowerDeviceVisualLayers.Charging" ]
          visible: false
    - type: ChameleonProjector
      whitelist:
        components:
          - MindContainer
        tags:
          - Bot # for funny bot moments
          - PersonaWhitelisted # You'd never guess but this is for stuff that is whitelisted
      blacklist:
        tags:
          - PersonaBlacklisted # You'd never guess but this is for stuff that is blacklisted
      disguiseProto: ChameleonDisguise
    - type: StaticPrice
      price: 5000

- type: entity
  parent: PersonaHologramGeneratorNoBattery
  id: PersonaHologramGenerator
  name: persona hologram generator
  description: An experimental strain of Holoparasite technology used to create a hard-light replica of most living beings around you. Disguise is destroyed when physical contact is made or deactivated. Doesn't allow the user to become Humanoids or Cyborgs.
  suffix: Battery
  components:
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.BatteryVisuals.State:
          enum.PowerDeviceVisualLayers.Powered:
            Full: { visible: true }
            Neither: { visible: true }
            Empty: { visible: false }
        enum.BatteryVisuals.Charging:
          enum.PowerDeviceVisualLayers.Charging:
            Charging: { visible: false }
            Decharging: { visible: true }
            Constant: { visible: false }
    - type: BatteryVisuals
    - type: ContainerContainer
      containers:
        cell_slot: !type:ContainerSlot
    - type: ItemSlots
      slots:
        cell_slot:
          name: power-cell-slot-component-slot-name-default
          startingItem: PowerCellMedium
          #Starlight Start
          blacklist:
            tags:
              - MechReactor
          #Starlight End
    - type: PowerCellSlot
      cellSlotId: cell_slot
    - type: PowerCellDraw
      drawRate: 4 # About 3 minutes with a medium cell.
    - type: ToggleCellDraw
    - type: ItemToggle
      onActivate: false
      onUse: false
