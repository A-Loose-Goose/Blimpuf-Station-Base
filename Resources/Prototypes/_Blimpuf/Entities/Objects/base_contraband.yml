# Tier and type describe how contraband is classified. Department and job lists describe who may carry it.
# These are kept separate so an authorization base can be combined with whichever tier an item needs.

# General classification bases for items that do not use departmental authorization.
- type: entity
  id: BaseHighlyIllegalContraband
  abstract: true
  components:
  - type: ScanDetectable
  - type: Contraband
    tier: Tier4

- type: entity
  id: BaseXenoborgContraband
  abstract: true
  components:
  - type: ScanDetectable
  - type: Contraband
    tier: Tier4
    contrabandType: Cybernetic

- type: entity
  id: BaseMagicalContraband
  abstract: true
  components:
  - type: ScanDetectable
  - type: Contraband
    tier: Tier4
    contrabandType: Magical

- type: entity
  id: BaseSyndicateContraband
  abstract: true
  components:
  - type: ScanDetectable
  - type: Contraband
    tier: Tier3
    contrabandType: Syndicate

- type: entity
  id: BaseMinorContraband
  abstract: true
  components:
  - type: Contraband
    tier: Tier2

- type: entity
  id: BaseMajorContraband
  abstract: true
  components:
  - type: ScanDetectable
  - type: Contraband
    tier: Tier3

# Tier-only mixins for authorized items. Put these before any parent that supplies a different tier.
# Tier 3 contraband is also detectable by security scanners.
- type: entity
  id: BaseContrabandTier2
  abstract: true
  components:
  - type: Contraband
    tier: Tier2

- type: entity
  id: BaseContrabandTier3
  abstract: true
  components:
  - type: ScanDetectable
  - type: Contraband
    tier: Tier3

- type: entity
  id: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    # Use the component's Tier1 default so authorization bases do not override an inherited tier.

# Authorization lists combine across parents. For tier and type, the first parent specifying a value wins.
# Single-department authorization bases.
- type: entity
  id: BaseCentcommContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    tier: Tier4
    contrabandType: CentralCommand
    allowedDepartments: [ CentralCommand ]

- type: entity
  id: BaseCommandContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedDepartments: [ Command ]

- type: entity
  id: BaseSecurityContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedDepartments: [ Security ]

- type: entity
  id: BaseEngineeringContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedDepartments: [ Engineering ]

- type: entity
  id: BaseScienceContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedDepartments: [ Science ]

- type: entity
  id: BaseMedicalContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedDepartments: [ Medical ]

- type: entity
  id: BaseCivilianContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedDepartments: [ Civilian ]

- type: entity
  id: BaseCargoContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedDepartments: [ Cargo ]

# Combined department authorization bases.
- type: entity
  id: BaseCentcommCommandContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    tier: Tier4
    contrabandType: CentralCommand
    allowedDepartments: [ CentralCommand, Command ]

- type: entity
  id: BaseSecurityCommandContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedDepartments: [ Security, Command ]

- type: entity
  id: BaseSecurityScienceCommandContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedDepartments: [ Security, Science, Command ]

- type: entity
  id: BaseSecurityEngineeringContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedDepartments: [ Security, Engineering ]

- type: entity
  id: BaseSiliconScienceContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedDepartments: [ Science, Silicon ]

- type: entity
  id: BaseSecurityCargoContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedDepartments: [ Security, Cargo ]

- type: entity
  id: BaseMedicalScienceContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedDepartments: [ Medical, Science ]

# Authorization bases that include specific jobs.
- type: entity
  id: BaseSecurityBartenderContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedDepartments: [ Security ]
    allowedJobs: [ Bartender ]

- type: entity
  id: BaseSecurityInternalAffairsContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedDepartments: [ Security ]
    allowedJobs: [ IAA ]

- type: entity
  id: BaseJanitorContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedJobs: [ Janitor ]

# Contraband used for theft objectives rather than ordinary departmental equipment.
- type: entity
  id: BaseGrandTheftContraband
  abstract: true
  components:
  - type: Contraband
    tier: Tier3
    allowedDepartments: [ Command ]
