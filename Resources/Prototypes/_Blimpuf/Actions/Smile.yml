- type: entity
  parent: BaseAction
  id: ActionLiquidSuck
  name: Suck Liquids
  description: Suck up nearby puddles directly into your internal storage tank.
  components:
    - type: Action
      priority: -20
      useDelay: 5
      itemIconStyle: BigAction
      icon:
        sprite: _Blimpuf/Smile/abilties.rsi
        state: SmileDrinkIcon
    - type: InstantAction
      event: !type:SuckUpLiquid

- type: entity
  parent: BaseAction
  id: ActionLiquidEmpty
  name: Empty Liquids
  description: Empty liquids from your internal storage tank.
  components:
    - type: Action
      priority: -20
      useDelay: 5
      itemIconStyle: BigAction
      icon:
        sprite: _Blimpuf/Smile/abilties.rsi
        state: SmileVomitIcon
    - type: InstantAction
      event: !type:EmptyLiquid

- type: entity
  parent: BaseAction
  id: ActionLiquidSpray
  name: Spray Liquids
  description: Spray liquids from your internal storage tank.
  components:
    - type: Action
      priority: -20
      useDelay: 60
      itemIconStyle: BigAction
      icon:
        sprite: _Blimpuf/Smile/abilties.rsi
        state: SmileSpitIcon
    - type: InstantAction
      event: !type:SprayLiquid
